services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pesa
      POSTGRES_PASSWORD: pesa
      POSTGRES_DB: pesa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesa"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://pesa:pesa@db:5432/pesa
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
